[workspace]
members = ["escrow"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BreadchainCoop/stellar-stablecoin-onramp-bot"

[workspace.dependencies]
soroban-sdk = "=29.0.1"

# Soroban-optimized release profile (matches the CoopStable contracts).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
